services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes: [ "./backend:/app" ]
    command: sh -c "pip install -q -r requirements.txt && python manage.py runserver 0.0.0.0:8000"
    ports: [ "8000:8000" ]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: [ "./frontend:/app" ]
    command: sh -c "npm install --silent && npm run dev"
    ports: [ "5173:5173" ]
    depends_on: [ backend ]
