services:
  - type: web
    name: roomsync-web
    env: docker
    region: oregon
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: roomsync-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: roomsync-db
    databaseName: roomsync
    user: roomsync_user
    region: oregon
    plan: free
